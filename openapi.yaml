                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
                - name: date
                  required: false
                  in: query
                  schema:
                      example: "2025-11-08"
                      type: string
                - name: limit
                  required: false
                  in: query
                  schema:
                      default: 20
                      example: 20
                      type: number
                - name: page
                  required: false
                  in: query
                  schema:
                      default: 1
                      example: 1
                      type: number
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaginatedScreeningsResponse"
            summary: Get screenings by movie
            tags:
                - Screening
    /screenings/{id}:
        get:
            description: Returns a single screening by its id.
            operationId: ScreeningController_getById
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GetScreeningResponse"
                "404":
                    description: ""
            summary: Get screening by id
            tags:
                - Screening
        patch:
            description: >-
                Updates a screening's movie, hall, or time. Only provided fields are
                changed. Admin only.
            operationId: ScreeningController_update
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateScreeningRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UpdateScreeningResponse"
                "404":
                    description: ""
            security:
                - bearer: []
            summary: Update screening
            tags:
                - Screening
        delete:
            description: Deletes a screening. Fails if it already has bookings. Admin only.
            operationId: ScreeningController_delete
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DeleteScreeningResponse"
                "404":
                    description: ""
            security:
                - bearer: []
            summary: Delete screening
            tags:
                - Screening
    /payment/init:
        post:
            description: Initiates a payment for a booking.
            operationId: PaymentController_initPayment
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InitPaymentRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InitPaymentResponse"
            security:
                - bearer: []
            summary: Init payment
            tags:
                - Payment
    /payment/refund/{id}:
        post:
            description: Refunds a previously made payment by its id.
            operationId: PaymentController_refundPayment
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RefundPaymentResponse"
            security:
                - bearer: []
            summary: Refund payment
            tags:
                - Payment
    /webhook/liqpay:
        post:
            operationId: WebhookController_handleLiqpay
            parameters: []
            responses:
                "200":
                    description: ""
            tags:
                - Webhook
    /bookings:
        get:
            description: Returns a paginated list of bookings for the current user.
            operationId: BookingController_getBookings
            parameters:
                - name: limit
                  required: false
                  in: query
                  schema:
                      default: 20
                      example: 20
                      type: number
                - name: page
                  required: false
                  in: query
                  schema:
                      default: 1
                      example: 1
                      type: number
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaginatedBookingsResponse"
            security:
                - bearer: []
            summary: Get user bookings
            tags:
                - Booking
info:
    title: Cinema Platform API
    description: API Gateway for Cinema Platform microservices
    version: "1.0"
    contact: {}
tags: []
servers: []
components:
    securitySchemes:
        bearer:
            scheme: bearer
            bearerFormat: JWT
            type: http
    schemas:
        SendOtpRequest:
            type: object
            properties:
                identifier:
                    type: string
                    example: cinema-platform@gmail.com
