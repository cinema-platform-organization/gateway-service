                    example: "123456"
                type:
                    type: string
                    example: email
                    enum:
                        - phone
                        - email
            required:
                - identifier
                - code
                - type
        AccessTokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
