openapi: 3.0.0
paths:
    /:
        get:
            description: Returns a simple API welcome message.
            operationId: AppController_getHello
            parameters: []
            responses:
                "200":
                    description: ""
            summary: Welcome endpoint
            tags:
                - App
    /health:
        get:
            description: Checks if the gateway is running.
            operationId: AppController_health
            parameters: []
            responses:
                "200":
                    description: Returns a health check object.
                    content:
                        application/json:
                            schema:
                                type: object
            summary: Health check
            tags:
                - App
    /metrics:
        get:
            operationId: PrometheusController_index
            parameters: []
            responses:
                "200":
                    description: ""
            tags:
                - Prometheus
    /auth/otp/send:
        post:
            description: Sends a verification code to the user's phone number or email.
            operationId: AuthController_sendOtp
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SendOtpRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OkResponse"
            summary: Send otp code
            tags:
                - Auth
    /auth/otp/verify:
        post:
            description: >-
                Verifies the code sent to the user phone number or email and returns an
                access token.
            operationId: AuthController_verifyOtp
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/VerifyOtpRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccessTokenResponse"
            summary: Verify otp code
            tags:
                - Auth
    /auth/refresh:
        post:
            description: Renews access token using refresh token from cookies.
            operationId: AuthController_refresh
            parameters: []
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccessTokenResponse"
            summary: Refresh access token
            tags:
                - Auth
    /auth/logout:
        post:
            description: Clears the refresh token cookie and logs the user out
            operationId: AuthController_logout
            parameters: []
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OkResponse"
            summary: Logout
            tags:
                - Auth
    /auth/telegram:
        get:
            description: Returns the data required to start the Telegram login flow.
            operationId: AuthController_telegramInit
            parameters: []
            responses:
                "200":
                    description: ""
            summary: Initialize Telegram login
            tags:
                - Auth
    /auth/telegram/verify:
        post:
            description: >-
                Verifies the payload returned by the Telegram login and returns either a
                redirect URL for account linking or an access token.
            operationId: AuthController_telegramVerify
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TelegramVerifyRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/AccessTokenResponse"
                                    - $ref: "#/components/schemas/TelegramInitResponse"
            summary: Verify Telegram login
            tags:
                - Auth
    /auth/telegram/finalize:
        post:
            description: >-
                Consumes the pending Telegram login/link request and completes
                authentication.
            operationId: AuthController_finalizeTelegramLogin
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TelegramFinalizeRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AccessTokenResponse"
            summary: Finalize Telegram login
            tags:
                - Auth
    /account/email/init:
        post:
            description: Sends a confirmation code to a new email address.
            operationId: AccountController_initEmailChange
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InitEmailChangeRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OkResponse"
            security:
                - bearer: []
            summary: Init email change
            tags:
                - Account
    /account/email/confirm:
        post:
            description: Verifies a confirmation code and updates user email address.
            operationId: AccountController_confirmEmailChange
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConfirmEmailChangeRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OkResponse"
            security:
                - bearer: []
            summary: Confirm email change
            tags:
                - Account
    /account/phone/init:
        post:
            description: Sends a confirmation code to a new phone number.
            operationId: AccountController_initPhoneChange
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InitPhoneChangeRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OkResponse"
            security:
                - bearer: []
            summary: Init phone change
            tags:
                - Account
    /account/phone/confirm:
        post:
            description: Verifies a confirmation code and updates user phone number.
            operationId: AccountController_confirmPhoneChange
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ConfirmPhoneChangeRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OkResponse"
            security:
                - bearer: []
            summary: Confirm phone change
            tags:
                - Account
    /users/@me:
        get:
            description: Returns authenticated user profile data.
            operationId: UsersController_getMe
            parameters: []
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GetMeResponse"
            security:
                - bearer: []
            summary: Get current user profile
            tags:
                - Users
        patch:
            description: Updates authenticated user profile data.
            operationId: UsersController_patchUser
            parameters: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PatchUserRequest"
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PatchUserResponse"
            security:
                - bearer: []
            summary: Update current user profile
            tags:
                - Users
    /users/@me/avatar:
        patch:
            description: Uploads a new avatar for the authenticated user
            operationId: UsersController_changeAvatar
            parameters: []
            requestBody:
                required: true
                description: Image file to upload
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                file:
                                    type: string
                                    format: binary
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PatchUserResponse"
            security:
                - bearer: []
            summary: Update user avatar
            tags:
                - Users
    /movies:
        get:
            description: Returns a paginated, filtered list of movies.
            operationId: MovieController_getAll
            parameters:
                - name: category
                  required: false
                  in: query
                  schema:
                      example: now
                      type: string
                - name: random
                  required: false
                  in: query
                  schema:
                      example: true
                      type: boolean
                - name: limit
                  required: false
                  in: query
                  schema:
                      default: 10
                      example: 12
                      type: number
                - name: page
                  required: false
                  in: query
                  schema:
                      default: 1
                      example: 1
                      type: number
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PaginatedMoviesResponse"
            summary: Get movies
            tags:
                - Movie
        post:
            description: Creates a new movie with a poster and optional banner. Admin only.
            operationId: MovieController_create
            parameters: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - title
                                - description
                                - duration
                                - poster
                            properties:
                                title:
                                    type: string
                                    example: Interstellar
                                slug:
                                    type: string
                                    example: interstellar
                                description:
                                    type: string
                                    example: A team of explorers travel through a wormhole in space.
                                duration:
                                    type: integer
                                    example: 169
                                releaseYear:
                                    type: integer
                                    example: 2014
                                releaseDate:
                                    type: string
                                    format: date
                                    example: "2014-11-07"
                                ratingAge:
                                    type: integer
                                    example: 12
                                country:
                                    type: string
                                    example: USA
                                categoryId:
                                    type: string
                                    example: 026f20c4-4826-4bea-b5e0-72ce8dda53d4
                                poster:
                                    type: string
                                    format: binary
                                banner:
                                    type: string
                                    format: binary
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CreateMovieResponse"
            security:
                - bearer: []
            summary: Create movie
            tags:
                - Movie
    /movies/id/{id}:
        get:
            description: Returns a single movie by its id, for admin editing.
            operationId: MovieController_getById
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GetMovieResponse"
                "404":
                    description: ""
            security:
                - bearer: []
            summary: Get movie by id
            tags:
                - Movie
    /movies/{slug}:
        get:
            description: Returns a single movie by its slug.
            operationId: MovieController_getBySlug
            parameters:
                - name: slug
                  required: true
                  in: path
                  schema:
                      type: string
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GetMovieResponse"
                "404":
                    description: ""
            summary: Get movie by slug
            tags:
                - Movie
    /movies/{id}:
        patch:
            description: >-
                Updates a movie. Only provided fields are changed. Replacing
                poster/banner deletes the old file. Admin only.
            operationId: MovieController_update
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                    example: Interstellar
                                slug:
                                    type: string
                                    example: interstellar
                                description:
                                    type: string
                                    example: A team of explorers travel through a wormhole in space.
                                duration:
                                    type: integer
                                    example: 169
                                releaseYear:
                                    type: integer
                                    example: 2014
                                releaseDate:
                                    type: string
                                    format: date
                                    example: "2014-11-07"
                                ratingAge:
                                    type: integer
                                    example: 12
                                country:
                                    type: string
                                    example: USA
                                categoryId:
                                    type: string
                                    example: 026f20c4-4826-4bea-b5e0-72ce8dda53d4
                                poster:
                                    type: string
                                    format: binary
                                banner:
                                    type: string
                                    format: binary
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UpdateMovieResponse"
                "404":
                    description: ""
            security:
                - bearer: []
            summary: Update movie
            tags:
                - Movie
        delete:
            description: >-
                Deletes a movie and its images. Fails if it has upcoming screenings.
                Admin only.
            operationId: MovieController_delete
            parameters:
                - name: id
                  required: true
                  in: path
                  schema:
                      type: string
            responses:
                "200":
                    description: ""
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DeleteMovieResponse"
                "404":
                    description: ""
            security:
                - bearer: []
            summary: Delete movie
            tags:
                - Movie
